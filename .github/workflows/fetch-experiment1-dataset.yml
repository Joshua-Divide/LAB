name: Fetch Experiment 1 dataset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p "Lab 1"
          if [ ! -f "Lab 1/data_banknote_authentication.txt" ]; then
            curl -L --fail "https://raw.githubusercontent.com/jaimedantas/SGD-SoftSVM/main/dataset/data_banknote_authentication.txt" -o "Lab 1/data_banknote_authentication.txt"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "Lab 1/data_banknote_authentication.txt"
            git commit -m "Add Experiment 1 dataset"
            git pull --rebase origin main
            git push
          fi

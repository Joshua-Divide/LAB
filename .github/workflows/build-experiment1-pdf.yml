name: Build Experiment 1 PDF

on:
  push:
    branches: [main]
    paths:
      - 'Lab 1/generate_experiment1_pdf.py'
      - '.github/workflows/build-experiment1-pdf.yml'

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy pandas matplotlib scikit-learn reportlab
      - run: python 'Lab 1/generate_experiment1_pdf.py'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Lab 1/Experiment 1.pdf'
          git commit -m 'Add Experiment 1 PDF'
          git pull --rebase origin main
          git push

name: Build Experiment 2 PDF

on:
  push:
    branches: [main]
    paths:
      - 'Lab 2/generate_experiment2_report.py'
      - '.github/workflows/build-experiment2-pdf.yml'

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy matplotlib pillow reportlab
      - run: python 'Lab 2/generate_experiment2_report.py'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Lab 2/Experiment 2.pdf'
          git commit -m 'Add Experiment 2 PDF'
          git pull --rebase origin main
          git push

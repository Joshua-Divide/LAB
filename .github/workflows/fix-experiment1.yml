name: Fix Experiment 1 files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-experiment1.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('Lab 1/generate_experiment1_pdf.py')
          s = p.read_text()
          s = s.replace(", learning_rate='constant'", "")
          s = s.replace("cm = confusion_matrix(y_test, y_pred)", "conf_mat = confusion_matrix(y_test, y_pred)")
          s = s.replace("ax.imshow(cm,", "ax.imshow(conf_mat,")
          s = s.replace("str(cm[i, j])", "str(conf_mat[i, j])")
          s = s.replace("cm[0,0]", "conf_mat[0,0]")
          s = s.replace("cm[0,1]", "conf_mat[0,1]")
          s = s.replace("cm[1,0]", "conf_mat[1,0]")
          s = s.replace("cm[1,1]", "conf_mat[1,1]")
          p.write_text(s)

          p = Path('Lab 1/Experiment 1.ipynb')
          nb = json.loads(p.read_text())
          for cell in nb['cells']:
              if cell.get('cell_type') == 'code':
                  cell['source'] = [line.replace(', learning_rate=\"constant\"', '') for line in cell.get('source', [])]
          p.write_text(json.dumps(nb, separators=(',', ':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Lab 1/generate_experiment1_pdf.py' 'Lab 1/Experiment 1.ipynb'
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Experiment 1 report generation'
            git pull --rebase origin main
            git push
          fi

name: Build Lab 5 assets
on:
  push:
    paths:
      - 'Lab 5/upload_manifest.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Lab 5 files
        shell: bash
        run: |
          set -euo pipefail
          test -f "Lab 5/upload_manifest.txt" || exit 0
          cat "Lab 5/.upload_chunks/report_"*.txt | base64 -d > "Lab 5/Experiment 5.pdf"
          cat "Lab 5/.upload_chunks/notebook_"*.txt | base64 -d > "Lab 5/Experiment 5.ipynb"
          rm -rf "Lab 5/.upload_chunks" "Lab 5/upload_manifest.txt"
      - name: Commit reconstructed files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Lab 5 Experiment 5 report and notebook"
          git push

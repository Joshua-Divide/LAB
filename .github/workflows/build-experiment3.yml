name: Build Experiment 3

on:
  push:
    branches: [main]
    paths:
      - 'Lab 3/generate_experiment3.py'
      - 'Lab 3/patch_experiment3_latex.py'
      - '.github/workflows/build-experiment3.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python and LaTeX dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra
          python -m pip install --quiet tensorflow-cpu==2.17.1 numpy pandas matplotlib scikit-learn reportlab pillow pymupdf
      - name: Cache CIFAR-10
        uses: actions/cache@v4
        with:
          path: ~/.keras/datasets
          key: cifar10-keras-v1
      - name: Ensure CIFAR-10 is available
        run: |
          mkdir -p ~/.keras/datasets
          if [ ! -d ~/.keras/datasets/cifar-10-batches-py ]; then
            if ! curl -L --fail --retry 4 --retry-delay 5 -o /tmp/cifar.tar.gz https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz; then
              curl -L --fail --retry 4 --retry-delay 5 -o /tmp/cifar.tar.gz 'https://www.dropbox.com/scl/fi/6mhiq4rtfszqrosasp8a9/cifar-10-batches-py.tar.gz?rlkey=g6v114un4je233j52tu5tdsbe&st=gxo2e50q&dl=1'
            fi
            tar -xzf /tmp/cifar.tar.gz -C ~/.keras/datasets
            cp /tmp/cifar.tar.gz ~/.keras/datasets/cifar-10-batches-py.tar.gz
          fi
      - name: Build report
        run: python 'Lab 3/generate_experiment3.py'
      - name: Render formulas with LaTeX
        run: python 'Lab 3/patch_experiment3_latex.py'
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Lab 3/Experiment 3.pdf'
          git diff --cached --quiet && exit 0
          git commit -m 'Update Experiment 3 PDF with LaTeX formulas'
          git pull --rebase origin main
          git push
